
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LIFF 初始化診斷</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: sans-serif;
      max-width: 640px;
      margin: 30px auto;
      padding: 20px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }
    #status {
      padding: 14px;
      background: #f2f2f2;
      border-radius: 8px;
      white-space: pre-wrap;
    }
    button {
      padding: 10px 16px;
      margin-top: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>LIFF 初始化診斷</h2>
  <p>這是暫時測試頁，不會連接正式報到資料。</p>
  <div id="status">準備中……</div>
  <button id="loginButton" hidden>使用 LINE 登入</button>

  <script>
    const LIFF_ID = "2011929218-7iUfDvyE";

    const statusBox = document.getElementById("status");
    const loginButton = document.getElementById("loginButton");

    function showStatus(message) {
      statusBox.textContent = message;
    }

    async function startDiagnostic() {
      showStatus(
        "診斷 1：開始檢查 SDK" +
        "\n網域：" + location.hostname +
        "\n是否在 iframe：" + (window.self !== window.top ? "是" : "否")
      );

      if (typeof liff === "undefined") {
        showStatus("錯誤：LIFF SDK 未載入。");
        return;
      }

      if (!LIFF_ID || LIFF_ID.startsWith("請稍後")) {
        showStatus(
          "診斷 2：LIFF SDK 已載入。" +
          "\n請先取得測試用 LIFF ID，再填入程式碼。"
        );
        return;
      }

      try {
        showStatus("診斷 2：SDK 已載入，開始初始化 LIFF……");

        await liff.init({ liffId: LIFF_ID });

        showStatus(
          "診斷 3：LIFF 初始化完成！" +
          "\n是否在 LINE 內：" + (liff.isInClient() ? "是" : "否") +
          "\n是否已登入：" + (liff.isLoggedIn() ? "是" : "否") +
          "\n網域：" + location.hostname
        );

        if (!liff.isLoggedIn()) {
          loginButton.hidden = false;
        }
      } catch (error) {
        showStatus(
          "LIFF 初始化失敗：" +
          (error && error.message ? error.message : String(error)) +
          "\n網域：" + location.hostname
        );
      }
    }

    loginButton.addEventListener("click", () => {
      liff.login();
    });

    startDiagnostic();
  </script>


<hr>
<h3>測試版後端連線（POST）</h3>
<button id="testBackendButton" onclick="testBackend()">
  測試 POST 連線
</button>
<p id="backendResult">尚未測試</p>

<iframe
  name="backendPostFrame"
  id="backendPostFrame"
  style="display:none">
</iframe>

<form
  id="backendPostForm"
  method="POST"
  target="backendPostFrame"
  style="display:none">
  <input type="hidden" name="action" value="ping">
  <input type="hidden" name="ticket" id="backendTicket">
</form>

<script>
const BACKEND_URL = "https://script.google.com/macros/s/AKfycbzAlcc6jm3rSgp0M0nqY4-trk8zr8-VaEGbnJY0sgf-H0gGb1OpjboIgH1hrKMiAGFK/exec";

let backendTimer = null;
let backendAttempts = 0;
let backendTicket = "";

function finishBackendTest(message) {
  clearTimeout(backendTimer);

  document.getElementById("backendResult").textContent = message;
  document.getElementById("testBackendButton").disabled = false;
}

function receiveBackendResult(data) {
  if (!data) return;

  if (data.success) {
    finishBackendTest("成功！" + data.message);
    return;
  }

  if (data.pending && backendAttempts < 15) {
    backendTimer = setTimeout(pollBackendResult, 1000);
    return;
  }

  finishBackendTest("尚未收到結果，請稍後再試。");
}

function pollBackendResult() {
  backendAttempts++;

  const oldScript = document.getElementById("backendPollScript");
  if (oldScript) oldScript.remove();

  const script = document.createElement("script");
  script.id = "backendPollScript";

  const callbackName = "receiveBackendResult";
  script.src =
    BACKEND_URL +
    "?callback=" + encodeURIComponent(callbackName) +
    "&ticket=" + encodeURIComponent(backendTicket) +
    "&t=" + Date.now();

  script.onerror = function () {
    finishBackendTest(
      "取回結果失敗，請確認測試版部署網址及權限。"
    );
  };

  document.body.appendChild(script);

  if (backendAttempts >= 15) {
    backendTimer = setTimeout(function () {
      finishBackendTest("等待後端結果逾時，請再測試一次。");
    }, 1000);
  }
}

function testBackend() {
  clearTimeout(backendTimer);

  const button = document.getElementById("testBackendButton");
  const result = document.getElementById("backendResult");

  button.disabled = true;
  result.textContent = "正在傳送 POST，請稍候……";

  // 建立隨機測試識別碼，不包含個資
  const bytes = new Uint8Array(16);
  crypto.getRandomValues(bytes);

  backendTicket = Array.from(bytes)
    .map(b => b.toString(16).padStart(2, "0"))
    .join("");

  backendAttempts = 0;

  const form = document.getElementById("backendPostForm");
  form.action = BACKEND_URL;

  document.getElementById("backendTicket").value = backendTicket;

  // 先開始輪詢，避免 POST 回應較快時漏接結果
  backendTimer = setTimeout(pollBackendResult, 1000);

  try {
    form.submit();
  } catch (error) {
    finishBackendTest("POST 傳送失敗，請檢查網址或程式碼。");
  }
}
</script>


</body>



</html>
