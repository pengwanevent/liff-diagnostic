
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>測試版相機診斷</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      line-height: 1.6;
      color: #222;
    }

    h2 { margin-bottom: 8px; }

    button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      font-size: 16px;
      border: 0;
      border-radius: 8px;
      background: #1769aa;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
    }

    video {
      display: block;
      width: 100%;
      min-height: 180px;
      margin-top: 12px;
      background: #111;
      border-radius: 8px;
    }

    #status {
      margin-top: 16px;
      padding: 12px;
      background: #f1f3f5;
      border-radius: 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .note {
      color: #555;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <h2>手機相機診斷</h2>
  <p>這是獨立測試頁，不需要 LINE 登入，也不會連接報到資料。</p>

  <button id="startBtn">啟動後置相機</button>
  <button id="stopBtn" disabled>停止相機</button>

  <video id="camera" autoplay playsinline muted></video>

  <div id="status">尚未啟動相機。</div>

  <p class="note">
    請使用 HTTPS 網址，並在 Chrome 中允許相機權限。
    測試時不會拍照、錄影或上傳影像。
  </p>

  <script>
    const video = document.getElementById("camera");
    const statusBox = document.getElementById("status");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");

    let stream = null;

    function showStatus(message) {
      statusBox.textContent = message;
    }

    async function startCamera() {
      startBtn.disabled = true;
      showStatus("正在檢查瀏覽器與相機權限……");

      try {
        if (!window.isSecureContext) {
          throw new Error(
            "目前不是安全的 HTTPS 網頁環境。"
          );
        }

        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {
          throw new Error(
            "瀏覽器沒有提供 getUserMedia 相機功能。"
          );
        }

        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: "environment" }
          }
        });

        video.srcObject = stream;
        await video.play();

        const track = stream.getVideoTracks()[0];
        const settings = track ? track.getSettings() : {};

        showStatus(
          "相機啟動成功！\n\n" +
          "安全環境：" + window.isSecureContext + "\n" +
          "相機：" + (track ? track.label : "已取得") + "\n" +
          "解析度：" +
          (settings.width || "未知") + " × " +
          (settings.height || "未知") + "\n\n" +
          "請確認上方是否看到即時相機畫面。"
        );

        stopBtn.disabled = false;

      } catch (error) {
        if (stream) {
          stream.getTracks().forEach(track => track.stop());
          stream = null;
        }

        video.srcObject = null;

        showStatus(
          "相機啟動失敗\n\n" +
          "錯誤名稱：" + (error.name || "未知") + "\n" +
          "錯誤內容：" + (error.message || String(error))
        );

      } finally {
        startBtn.disabled = false;
      }
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      video.srcObject = null;
      stopBtn.disabled = true;
      showStatus("相機已停止。");
    }

    startBtn.addEventListener("click", startCamera);
    stopBtn.addEventListener("click", stopCamera);

    window.addEventListener("pagehide", stopCamera);
  </script>
</body>
</html>
