
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>LIFF 初始化診斷</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f4f6f8;
      color: #263238;
      margin: 0;
      padding: 20px 14px;
    }

    main {
      max-width: 520px;
      margin: auto;
    }

    section {
      background: white;
      padding: 20px;
      margin-bottom: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 10px #0000000d;
    }

    h2, h3 { margin-top: 0; }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      background: #176b55;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .message {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #f0f3f5;
      padding: 12px;
      border-radius: 8px;
      line-height: 1.7;
    }
  </style>
</head>

<body>
<main>
  <section>
    <h2>LIFF 初始化診斷</h2>
    <p>這是暫時測試頁，不會連接正式報到資料。</p>
    <div id="liffResult" class="message">正在初始化 LIFF……</div>
  </section>

  <section>
    <h3>測試版後端連線（POST）</h3>
    <button id="testBackendButton" onclick="testBackend()">
      測試 POST 連線
    </button>
    <div id="backendResult" class="message">尚未測試</div>
  </section>

<section>
  <h3>個人報到資料測試</h3>
  <button id="queryQrButton" onclick="queryMyQr()">
    查詢我的報到資料
  </button>
  <div id="myQrResult" class="message">
    請在 LINE 內登入後，再查詢報到資料。
  </div>
  <img
    id="testParticipantQr"
    alt="測試版個人報到 QR Code
    "
    style="display:none;width:240px;max-width:100%;margin:16px auto;"
  >
</section>

  <iframe
    name="backendPostFrame"
    id="backendPostFrame"
    style="display:none">
  </iframe>

  <form
    id="backendPostForm"
    method="POST"
    target="backendPostFrame"
    style="display:none">

    <input type="hidden" name="action" value="ping">
    <input type="hidden" name="idToken" id="backendIdToken">
    <input type="hidden" name="ticket" id="backendTicket">
    <input type="hidden" name="idToken" id="backendIdToken">
  </form>
</main>

<script>
  const LIFF_ID = "2011929218-7iUfDvyE";

  // 請填入目前測試版 Apps Script 的 Web App /exec 網址。
  // 不要填正式版網址。
  const BACKEND_URL = "https://script.google.com/macros/s/AKfycbzAlcc6jm3rSgp0M0nqY4-trk8zr8-VaEGbnJY0sgf-H0gGb1OpjboIgH1hrKMiAGFK/exec";

  let backendTicket = "";
  let backendAttempts = 0;
  let backendTimer = null;

  const MAX_ATTEMPTS = 15;

  function showLiffResult(message) {
    document.getElementById("liffResult").textContent = message;
  }

  async function initLiff() {
    try {
      if (typeof liff === "undefined") {
        throw new Error("LIFF SDK 尚未載入。");
      }

      await liff.init({ liffId: LIFF_ID });

      showLiffResult(
        "診斷 3：LIFF 初始化完成！" +
        "\n是否在 LINE 內：" + (liff.isInClient() ? "是" : "否") +
        "\n是否已登入：" + (liff.isLoggedIn() ? "是" : "否") +
        "\n網域：" + window.location.hostname
      );
    } catch (error) {
      showLiffResult(
        "LIFF 初始化失敗：" +
        (error && error.message ? error.message : String(error))
      );
    }
  }


function finishBackendTest(message) {
  clearTimeout(backendTimer);

  document.getElementById("backendResult").textContent = message;
  document.getElementById("testBackendButton").disabled = false;

  const queryButton = document.getElementById("queryQrButton");
  if (queryButton) queryButton.disabled = false;
}



let currentAction = "ping";

function receiveBackendResult(data) {
  if (!data) return;

  if (data.pending) {
    if (backendAttempts < MAX_ATTEMPTS) {
      backendTimer = setTimeout(pollBackendResult, 1000);
    } else {
      finishBackendTest("等待後端結果逾時，請檢查測試版部署與取回流程。");
      document.getElementById("myQrResult").textContent =
        "查詢逾時，請稍後再試。";
    }
    return;
  }

  // 個人報到資料查詢結果
  if (currentAction === "getMyQr") {
    const result = document.getElementById("myQrResult");
    const qr = document.getElementById("testParticipantQr");

    if (data.bound === false) {
      result.textContent =
        "LINE 身分驗證成功，但這個 LINE 帳號尚未綁定參加者資料。";
      qr.style.display = "none";
      qr.removeAttribute("src");
      finishBackendTest("個人資料查詢完成：尚未綁定。");
      return;
    }

    if (data.bound === true && data.participant) {
      const p = data.participant;

      result.textContent =
        "查詢成功！\n" +
        "姓名：" + (p.name || "未提供") + "\n" +
        "期別學號：" + (p.studentId || "未提供") + "\n" +
        "參加人數：" + (p.count || "未填寫") + "\n" +
        "飲食需求：" + (p.diet || "未填寫") + "\n" +
        "報到狀態：" + (p.status || "未提供");

      if (p.qrUrl) {
        qr.src =
          "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" +
          encodeURIComponent(p.qrUrl);
        qr.style.display = "block";
      } else {
        qr.style.display = "none";
        qr.removeAttribute("src");
      }

      finishBackendTest("個人報到資料查詢成功。");
      return;
    }

    result.textContent =
      data.message || "查詢失敗，請檢查測試版後端設定。";
    finishBackendTest(result.textContent);
    return;
  }

  // 原有 ping 測試結果
  if (data.success) {
    finishBackendTest(
      "成功！" + data.message +
      (data.time ? "\n時間：" + data.time : "")
    );
    return;
  }

  finishBackendTest(
    data.message || "後端回傳失敗，請檢查程式設定。"
  );
}

  
function queryMyQr() {
  const result = document.getElementById("myQrResult");

  if (typeof liff === "undefined" || !liff.isLoggedIn()) {
    result.textContent = "請先在 LINE 內完成登入，再查詢報到資料。";
    return;
  }

  const token = liff.getIDToken();

  if (!token) {
    result.textContent =
      "無法取得 LINE ID Token，請確認 LIFF 已啟用 openid 權限。";
    return;
  }

  clearTimeout(backendTimer);

  const bytes = new Uint8Array(16);
  crypto.getRandomValues(bytes);

  backendTicket = Array.from(bytes)
    .map(b => b.toString(16).padStart(2, "0"))
    .join("");

  backendAttempts = 0;
  currentAction = "getMyQr";

  result.textContent = "正在驗證 LINE 身分並查詢測試版資料……";

  const qr = document.getElementById("testParticipantQr");
  qr.style.display = "none";
  qr.removeAttribute("src");

  document.getElementById("testBackendButton").disabled = true;
  document.getElementById("queryQrButton").disabled = true;

  document.getElementById("backendPostForm").action = BACKEND_URL;
  document.querySelector('#backendPostForm [name="action"]').value =
    "getMyQr";
  document.getElementById("backendTicket").value = backendTicket;
  document.getElementById("backendIdToken").value = token;

  backendTimer = setTimeout(pollBackendResult, 1000);

  try {
    document.getElementById("backendPostForm").submit();
  } catch (error) {
    result.textContent =
      "查詢送出失敗：" +
      (error && error.message ? error.message : String(error));

    finishBackendTest(result.textContent);
  }
}

  

  function pollBackendResult() {
    backendAttempts++;

    const oldScript = document.getElementById("backendPollScript");
    if (oldScript) oldScript.remove();

    const script = document.createElement("script");
    script.id = "backendPollScript";

    script.src =
      BACKEND_URL +
      "?callback=receiveBackendResult" +
      "&ticket=" + encodeURIComponent(backendTicket) +
      "&t=" + Date.now();

    script.onerror = function () {
      finishBackendTest(
        "取回結果失敗：JSONP 請求無法載入。" +
        "\n請確認測試版 /exec 網址、部署權限及回應狀態碼。"
      );
    };

    document.body.appendChild(script);
  }

  function testBackend() {
    currentAction = "ping";
    clearTimeout(backendTimer);

    if (
      !BACKEND_URL.startsWith("https://script.google.com/macros/s/") ||
      !BACKEND_URL.endsWith("/exec")
    ) {
      finishBackendTest(
        "請先把 BACKEND_URL 改成正確的測試版 Apps Script /exec 網址。"
      );
      return;
    }

    const button = document.getElementById("testBackendButton");
    const result = document.getElementById("backendResult");

    button.disabled = true;
    result.textContent = "正在傳送 POST，請稍候……";

    const bytes = new Uint8Array(16);
    crypto.getRandomValues(bytes);

    backendTicket = Array.from(bytes)
      .map(b => b.toString(16).padStart(2, "0"))
      .join("");

    backendAttempts = 0;

    const form = document.getElementById("backendPostForm");
    form.action = BACKEND_URL;

    document.getElementById("backendTicket").value = backendTicket;

    // 先開始輪詢，再送出 POST，避免錯過快速回應。
    backendTimer = setTimeout(pollBackendResult, 1000);

    try {
      form.submit();
    } catch (error) {
      finishBackendTest(
        "POST 傳送失敗：" +
        (error && error.message ? error.message : String(error))
      );
    }
  }

  window.addEventListener("load", initLiff);
</script>
</body>
</html>
