
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>活動報到｜工作人員測試版</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px; font-family: Arial, sans-serif;
      color: #222; background: #f5f6f8; line-height: 1.6;
    }
    main { max-width: 560px; margin: auto; }
    h1 { font-size: 24px; }
    .card {
      background: white; border-radius: 14px; padding: 18px;
      margin: 14px 0; box-shadow: 0 2px 10px #0000000d;
    }
    input, button {
      width: 100%; padding: 13px; font-size: 16px;
      border-radius: 9px; margin-top: 10px;
    }
    input { border: 1px solid #bbb; background: white; }
    button { border: 0; background: #2457a7; color: white; font-weight: 600; }
    button.secondary { background: #e7ebf2; color: #222; }
    button.danger { background: #9b3030; }
    button:disabled { opacity: .5; }
    .hidden { display: none !important; }
    .muted { color: #666; font-size: 14px; }
    #message { white-space: pre-wrap; overflow-wrap: anywhere; }
    .status { font-weight: bold; font-size: 18px; }
    .ok { color: #187344; }
    .warn { color: #a15c00; }
    .err { color: #b42318; }
    .field { padding: 8px 0; border-bottom: 1px solid #eee; }
    .field:last-child { border-bottom: 0; }
    .label { color: #666; font-size: 13px; }
    .value { font-size: 18px; font-weight: 600; overflow-wrap: anywhere; }
    #reader { width: 100%; }
    dialog {
      width: calc(100% - 32px); max-width: 420px;
      border: 0; border-radius: 16px; padding: 22px;
      box-shadow: 0 10px 50px #0005;
    }
    dialog::backdrop { background: #0008; }
  </style>
</head>
<body>
<main>
  <h1>活動報到系統</h1>
  <p class="muted">工作人員專用｜測試版</p>

  <section class="card" id="loginPanel">
    <h2>工作人員登入</h2>
    <p class="muted">請輸入工作人員 PIN。登入後工作階段有效時間為六小時。</p>
    <form id="loginForm">
      <input id="pin" type="password" inputmode="numeric"
        autocomplete="current-password" placeholder="工作人員 PIN" required>
      <button id="loginButton" type="submit">登入</button>
    </form>
  </section>

  <section class="card hidden" id="scannerPanel">
    <div class="status" id="loginStatus">已登入</div>
    <p class="muted">請將參加者 QR Code 放入相機畫面。</p>
    <div id="reader"></div>
    <button id="startButton">啟動相機</button>
    <button id="stopButton" class="secondary">停止相機</button>
    <button id="logoutButton" class="danger">登出</button>
  </section>

  <section class="card hidden" id="participantPanel">
    <h2>參加者資料</h2>
    <div id="participantInfo"></div>
    <p id="participantStatus" class="status"></p>
    <button id="checkInButton">確認報到</button>
    <button id="nextButton" class="secondary">掃描下一位</button>
  </section>

  <section class="card">
    <div id="message" role="status" aria-live="polite">請先登入。</div>
  </section>
</main>

<dialog id="confirmDialog">
  <h2>確認報到</h2>
  <p id="confirmText">請確認參加者資料。</p>
  <button id="confirmYes">確認，執行報到</button>
  <button id="confirmNo" class="secondary">取消</button>
</dialog>

<iframe name="postFrame" id="postFrame" class="hidden"></iframe>

<script>
"use strict";

/*
 * 僅供測試版使用。
 * 若更換測試版部署網址，請只修改這一行。
 */
const WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbzAlcc6jm3rSgp0M0nqY4-trk8zr8-VaEGbnJY0sgf-H0gGb1OpjboIgH1hrKMiAGFK/exec";

const SESSION_KEY = "eventStaffSession_test";
const DEVICE_NAME = "GitHub Pages 工作人員手機";

const $ = id => document.getElementById(id);

let session = "";
let scanner = null;
let cameraRunning = false;
let busy = false;
let currentCode = "";
let currentParticipant = null;
let pendingCheckIn = false;
let requestSequence = 0;

function message(text, type = "") {
  $("message").className = type;
  $("message").textContent = text;
}

function show(el, yes) {
  el.classList.toggle("hidden", !yes);
}

function newTicket() {
  const bytes = new Uint8Array(24);
  crypto.getRandomValues(bytes);
  return Array.from(bytes)
    .map(b => b.toString(16).padStart(2, "0")).join("");
}

/*
 * POST 使用隱藏 iframe，避免跨來源 fetch 的 CORS 限制。
 * 接著透過 JSONP 輪詢 doGet 取回同一張 ticket 的結果。
 */
function api(action, fields = {}) {
  return new Promise((resolve, reject) => {
    const ticket = newTicket();
    const callbackName = "staffCallback_" + ticket;
    const form = document.createElement("form");
    form.method = "POST";
    form.action = WEB_APP_URL;
    form.target = "postFrame";
    form.style.display = "none";

    const payload = { action, ticket, ...fields };

    for (const [name, value] of Object.entries(payload)) {
      const input = document.createElement("input");
      input.type = "hidden";
      input.name = name;
      input.value = String(value == null ? "" : value);
      form.appendChild(input);
    }

    let done = false;
    let attempts = 0;
    let pollTimer = null;
    let script = null;

    function cleanup() {
      if (pollTimer) clearTimeout(pollTimer);
      if (script) script.remove();
      try { delete window[callbackName]; } catch (_) {}
      form.remove();
    }

    function finish(err, result) {
      if (done) return;
      done = true;
      cleanup();
      if (err) reject(err);
      else resolve(result);
    }

    function poll() {
      if (done) return;

      if (++attempts > 25) {
        finish(new Error("等待後端回覆逾時，請確認網路後重試。"));
        return;
      }

      script = document.createElement("script");
      const thisScript = script;

      window[callbackName] = data => {
        thisScript.remove();
        script = null;

        if (data && data.pending) {
          pollTimer = setTimeout(poll, 1000);
        } else if (data && typeof data === "object") {
          finish(null, data);
        } else {
          finish(new Error("後端回覆格式不正確。"));
        }
      };

      script.onerror = () => {
        thisScript.remove();
        script = null;
        pollTimer = setTimeout(poll, 1000);
      };

      script.src =
        WEB_APP_URL +
        "?callback=" + encodeURIComponent(callbackName) +
        "&ticket=" + encodeURIComponent(ticket) +
        "&_=" + Date.now();

      document.head.appendChild(script);
    }

    document.body.appendChild(form);

    try {
      form.submit();
      pollTimer = setTimeout(poll, 300);
    } catch (err) {
      finish(new Error("無法送出請求：" + err.message));
    }
  });
}

async function stopCamera() {
  if (!scanner) return;
  try {
    if (cameraRunning) await scanner.stop();
  } catch (err) {
    console.warn("停止相機時發生問題：", err);
  }
  cameraRunning = false;
}

$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();
  if (busy) return;

  const pin = $("pin").value.trim();
  if (!pin) {
    message("請輸入工作人員 PIN。", "err");
    return;
  }

  busy = true;
  $("loginButton").disabled = true;
  message("正在驗證工作人員……");

  try {
    const result = await api("staffLogin", { pin });

    if (!result.success || !result.session) {
      throw new Error(result.message || "登入失敗。");
    }

    session = result.session;
    localStorage.setItem(SESSION_KEY, session);
    $("pin").value = "";

    show($("loginPanel"), false);
    show($("scannerPanel"), true);
    show($("participantPanel"), false);
    message("登入成功，請啟動相機。", "ok");

  } catch (err) {
    message(err.message || String(err), "err");
  } finally {
    busy = false;
    $("loginButton").disabled = false;
  }
});

async function startScanner() {
  if (busy || cameraRunning) return;

  if (!session) {
    message("工作階段不存在，請重新登入。", "err");
    return;
  }

  if (!window.Html5Qrcode) {
    message("掃描元件載入失敗，請確認網路後重新整理。", "err");
    return;
  }

  try {
    if (!scanner) scanner = new Html5Qrcode("reader");

    message("正在啟動相機……");

    await scanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 250 } },
      decodedText => {
        if (!busy && !currentCode) {
          handleScan(decodedText);
        }
      },
      () => {}
    );

    cameraRunning = true;
    message("相機已啟動，請掃描參加者 QR Code。", "ok");

  } catch (err) {
    cameraRunning = false;
    message(
      "無法啟動相機。\n" +
      (err && err.message ? err.message : String(err)) +
      "\n\n請確認使用 HTTPS、瀏覽器相機權限已開啟，並允許此網站使用相機。",
      "err"
    );
  }
}

function extractCode(text) {
  const raw = String(text || "").trim();

  try {
    const url = new URL(raw);
    const code = url.searchParams.get("code");
    if (code) return code.trim();
  } catch (_) {}

  // 允許直接掃描識別碼；網址格式則必須帶 code 參數。
  if (/^[A-Za-z0-9_-]{4,80}$/.test(raw)) return raw;

  throw new Error("無法從 QR Code 讀取有效的報到識別碼。");
}

async function handleScan(decodedText) {
  if (busy || currentCode) return;
  busy = true;

  try {
    await stopCamera();

    const code = extractCode(decodedText);
    message("已讀取 QR Code，正在查詢參加者……");

    const result = await api("staffLookup", {
      code,
      session
    });

    if (!result.success) {
      if (/工作階段|重新驗證|逾期|無效/.test(result.message || "")) {
        await expireSession(result.message);
        return;
      }
      throw new Error(result.message || "查詢失敗。");
    }

    currentCode = code;
    currentParticipant = result.participant;
    renderParticipant(currentParticipant);

    show($("participantPanel"), true);
    message("查詢成功，請確認參加者資料。", "ok");

  } catch (err) {
    message(err.message || String(err), "err");
    currentCode = "";
    currentParticipant = null;
  } finally {
    busy = false;
  }
}

function renderParticipant(p) {
  const fields = [
    ["姓名", p.name],
    ["期別學號", p.studentId],
    ["參加人數", p.count],
    ["報到狀態", p.status],
    ["報到時間", p.checkInTime || "—"],
    ["報到設備", p.device || "—"]
  ];

  $("participantInfo").replaceChildren();

  fields.forEach(([label, value]) => {
    const row = document.createElement("div");
    row.className = "field";

    const labelEl = document.createElement("div");
    labelEl.className = "label";
    labelEl.textContent = label;

    const valueEl = document.createElement("div");
    valueEl.className = "value";
    valueEl.textContent = value || "—";

    row.append(labelEl, valueEl);
    $("participantInfo").appendChild(row);
  });

  const already = p.status === "已報到";
  $("participantStatus").textContent = already
    ? "此參加者已經報到"
    : "尚未報到";

  $("participantStatus").className =
    "status " + (already ? "warn" : "ok");

  $("checkInButton").disabled = already;
  $("checkInButton").textContent =
    already ? "已報到，不可重複報到" : "確認報到";
}

$("checkInButton").addEventListener("click", () => {
  if (!currentParticipant || !currentCode || busy) return;

  if (currentParticipant.status === "已報到") {
    message("此參加者已經報到，不會再次寫入。", "warn");
    return;
  }

  $("confirmText").textContent =
    "確認為「" + currentParticipant.name +
    "」執行報到？\n期別學號：" +
    currentParticipant.studentId +
    "\n參加人數：" + currentParticipant.count;

  $("confirmDialog").showModal();
});

$("confirmNo").addEventListener("click", () => {
  $("confirmDialog").close();
});

$("confirmYes").addEventListener("click", async () => {
  $("confirmDialog").close();

  if (busy || !currentCode || !session) return;
  busy = true;
  $("checkInButton").disabled = true;
  message("正在寫入報到資料……");

  try {
    const result = await api("staffCheckIn", {
      code: currentCode,
      device: DEVICE_NAME,
      session
    });

    if (!result.success) {
      if (/工作階段|重新驗證|逾期|無效/.test(result.message || "")) {
        await expireSession(result.message);
        return;
      }
      throw new Error(result.message || "報到失敗。");
    }

    currentParticipant = result.participant;
    renderParticipant(currentParticipant);

    if (result.already) {
      message("此參加者已經報到，系統未重複寫入。", "warn");
    } else if (result.ok) {
      message("✓ 報到完成！", "ok");
    } else {
      message("後端未確認報到完成，請核對試算表。", "err");
    }

  } catch (err) {
    message(
      (err.message || String(err)) +
      "\n若不確定後端是否已寫入，請先重新查詢，不要連續重試。",
      "err"
    );
  } finally {
    busy = false;
    $("checkInButton").disabled =
      !currentParticipant ||
      currentParticipant.status === "已報到";
  }
});

$("nextButton").addEventListener("click", async () => {
  if (busy) return;

  currentCode = "";
  currentParticipant = null;
  show($("participantPanel"), false);
  message("準備掃描下一位……");
  await startScanner();
});

$("startButton").addEventListener("click", startScanner);

$("stopButton").addEventListener("click", async () => {
  await stopCamera();
  message("相機已停止。按「啟動相機」可繼續掃描。");
});

async function expireSession(reason) {
  await stopCamera();

  session = "";
  localStorage.removeItem(SESSION_KEY);
  currentCode = "";
  currentParticipant = null;

  show($("loginPanel"), true);
  show($("scannerPanel"), false);
  show($("participantPanel"), false);

  message(
    (reason || "工作階段已失效。") +
    "\n請重新輸入工作人員 PIN。",
    "err"
  );
}

$("logoutButton").addEventListener("click", async () => {
  await stopCamera();
  session = "";
  currentCode = "";
  currentParticipant = null;
  localStorage.removeItem(SESSION_KEY);

  show($("loginPanel"), true);
  show($("scannerPanel"), false);
  show($("participantPanel"), false);
  message("已登出。");
});

/*
 * 不直接信任 localStorage 中的舊工作階段。
 * 先讓工作人員重新登入，以確認工作階段仍有效。
 */
show($("loginPanel"), true);
show($("scannerPanel"), false);
show($("participantPanel"), false);
message("請登入後開始測試。");
</script>
</body>
</html>
