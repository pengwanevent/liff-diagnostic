<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF3F7">
  <title>活動報到｜工作人員測試版</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #FFF3F7;
      --card: #FFFFFF;
      --pink: #C96F95;
      --pink-dark: #9F4E72;
      --pink-light: #FBE3ED;
      --text: #513744;
      --muted: #896D7A;
      --border: #F0D2DF;
      --orange: #A85C08;
      --orange-bg: #FFF2DC;
      --red: #B42318;
      --red-bg: #FFF0EE;
    }


    
/* 已報到提示：大字、粗體、紅色 */

.already-checked-in {
    color: #D00000 !important;
    font-size: 26px !important;
    font-weight: 900 !important;
    line-height: 1.5;
}

    body {
      margin: 0;
      padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      font-family: Arial, "Noto Sans TC", sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.65;
      font-size: 18px;
      -webkit-text-size-adjust: 100%;
    }

    main {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }

    .hero {
      text-align: center;
      padding: 12px 8px 18px;
    }

    .hero-icon {
      display: flex;
      width: 88px;
      height: 88px;
      margin: 0 auto 12px;
      align-items: center;
      justify-content: center;
      border-radius: 28px;
      background: linear-gradient(145deg, #FFE5EF, #F8D1E1);
      border: 2px solid #F0C4D7;
      box-shadow: 0 5px 14px rgba(159, 78, 114, 0.12);
      font-size: 54px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.35;
      font-weight: 800;
      letter-spacing: 1px;
      text-align: center;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 24px;
      line-height: 1.4;
      text-align: center;
    }

    p { margin: 8px 0 14px; }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 16px;
      text-align: center;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 22px 18px;
      margin: 16px 0;
      box-shadow: 0 4px 16px rgba(159, 78, 114, 0.07);
    }

    .hidden { display: none !important; }

    .muted {
      color: var(--muted);
      font-size: 16px;
      text-align: center;
    }

    input, button {
      width: 100%;
      min-height: 56px;
      padding: 14px 16px;
      font-family: inherit;
      font-size: 19px;
      line-height: 1.4;
      border-radius: 14px;
      margin-top: 12px;
    }

    input {
      border: 2px solid var(--border);
      background: #fff;
      color: var(--text);
      text-align: center;
    }

    input:focus {
      outline: 3px solid #F8D1E1;
      border-color: var(--pink);
    }

    button {
      border: 0;
      background: var(--pink);
      color: #fff;
      font-weight: 750;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    button:hover { background: var(--pink-dark); }
    button:active { transform: scale(0.99); }

    button.secondary {
      color: var(--pink-dark);
      background: #FBEAF1;
      border: 1px solid #F0D2DF;
    }

    button.secondary:hover { background: #F6DCE8; }

    button.danger {
      color: #fff;
      background: #A43A52;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .login-badge {
      display: inline-block;
      padding: 7px 14px;
      border-radius: 999px;
      background: var(--pink-light);
      color: var(--pink-dark);
      font-size: 16px;
      font-weight: 700;
      text-align: center;
    }

    .center, #loginStatus { text-align: center; }

    #loginStatus { margin-bottom: 12px; }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 16px;
      background: #FFF8FB;
      border: 1px solid var(--border);
      margin: 16px auto;
    }

    #reader video { border-radius: 12px; }

    #reader__dashboard_section_csr button,
    #reader__dashboard_section_swaplink {
      font-size: 16px !important;
    }

    .scan-hint {
      background: #FFF0F6;
      border: 1px solid #F6D8E5;
      border-radius: 14px;
      padding: 12px;
      color: var(--pink-dark);
      text-align: center;
      font-size: 16px;
    }

    .status {
      font-size: 21px;
      font-weight: 800;
      text-align: center;
      padding: 14px 10px;
      border-radius: 14px;
      margin: 16px 0;
      background: var(--pink-light);
      color: var(--pink-dark);
      overflow-wrap: anywhere;
    }

    .ok {
      color: var(--pink-dark);
      background: var(--pink-light);
    }

    .warn {
      color: var(--orange);
      background: var(--orange-bg);
    }

    .err {
      color: var(--red);
      background: var(--red-bg);
    }

    .participant-name {
      font-size: 32px;
      font-weight: 850;
      text-align: center;
      line-height: 1.4;
      overflow-wrap: anywhere;
      margin: 12px 0 20px;
    }

    .participant-info {
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }

    .field {
      padding: 14px 12px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      background: #fff;
    }

    .field:last-child { border-bottom: 0; }

    .label {
      color: var(--muted);
      font-size: 16px;
      margin-bottom: 4px;
    }

    .value {
      font-size: 22px;
      font-weight: 750;
      overflow-wrap: anywhere;
    }

    #message {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      text-align: center;
      font-size: 18px;
      font-weight: 650;
      padding: 12px 4px;
    }

    .message-card { padding: 14px 18px; }

    .next-button {
      min-height: 62px;
      font-size: 21px;
      margin: 0 0 20px;
    }

    .footer-note {
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      margin: 22px 0 8px;
    }

    dialog {
      width: calc(100% - 28px);
      max-width: 430px;
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 24px 20px;
      color: var(--text);
      background: #fff;
      box-shadow: 0 12px 50px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    dialog::backdrop { background: rgba(81, 55, 68, 0.48); }

    #confirmText {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 19px;
      line-height: 1.8;
      text-align: center;
      margin: 18px 0;
    }

    @media (max-width: 380px) {
      body {
        padding-left: 10px;
        padding-right: 10px;
      }

      .card { padding: 18px 13px; }
      h1 { font-size: 27px; }
      .participant-name { font-size: 28px; }
      .value { font-size: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>

<body>
<main>
  <header class="hero">
    <div class="hero-icon" aria-label="Q版大象" role="img">🐘</div>
    <h1>活動報到系統</h1>
    <p class="subtitle">工作人員專用｜測試版</p>
  </header>

  <section class="card" id="loginPanel">
    <h2>工作人員登入</h2>
    <p class="muted">請輸入登入者名稱及工作人員 PIN，登入後即可開始掃描報到。</p>

    <form id="loginForm">
      <input
        id="deviceName"
        type="text"
        maxlength="10"
        autocomplete="off"
        placeholder="請輸入登入者（最多 10 個字）"
        aria-label="登入者"
        required
      >
      <input
        id="pin"
        type="password"
        inputmode="numeric"
        autocomplete="current-password"
        placeholder="請輸入工作人員 PIN"
        aria-label="工作人員 PIN"
        required
      >
      <button id="loginButton" type="submit">登入工作人員系統</button>
    </form>
  </section>

  <!-- 參加者資料放在相機區上方 -->
  <section class="card hidden" id="participantPanel">
    <button id="nextButton" class="secondary next-button">掃描下一位</button>

    <h2>參加者資料</h2>
    <div id="participantInfo" class="participant-info"></div>
    <p id="participantStatus" class="status" aria-live="polite"></p>
    <button id="checkInButton">確認報到</button>
  </section>

  <!-- 相機及登入狀態區放在下方 -->
  <section class="card hidden" id="scannerPanel">
    <div id="loginStatus">
      <span class="login-badge">✓ 工作人員已登入</span>
    </div>

    <h2>📷 掃描參加者 QR Code</h2>
    <p class="muted">請將參加者的 QR Code 對準相機畫面。</p>

    <div id="reader"></div>

    <div class="scan-hint">
      請確認參加者出示的是活動報到 QR Code。
    </div>

    <button id="startButton">啟動相機</button>
    <button id="stopButton" class="secondary">停止相機</button>
    <button id="logoutButton" class="danger">登出</button>
  </section>

  <section class="card message-card">
    <div id="message" role="status" aria-live="polite">請先登入。</div>
  </section>

  <p class="footer-note">活動報到系統・工作人員操作介面</p>
</main>

<dialog id="confirmDialog">
  <h2>確認報到</h2>
  <p id="confirmText">請確認參加者資料。</p>
  <button id="confirmYes">✓ 確認，執行報到</button>
  <button id="confirmNo" class="secondary">返回確認資料</button>
</dialog>

<iframe name="postFrame" id="postFrame" class="hidden"></iframe>


<script>
"use strict";

const WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbzAlcc6jm3rSgp0M0nqY4-trk8zr8-VaEGbnJY0sgf-H0gGb1OpjboIgH1hrKMiAGFK/exec";

const SESSION_KEY = "eventStaffSession_test";
let currentDeviceName = "";

const $ = id => document.getElementById(id);

let session = "";
let scanner = null;
let cameraRunning = false;
let busy = false;
let currentCode = "";
let currentParticipant = null;

/* =========================
   共用訊息及畫面功能
========================= */

function message(text, type = "") {
  $("message").className = type;
  $("message").textContent = text;
}

function show(el, yes) {
  el.classList.toggle("hidden", !yes);
}

function newTicket() {
  const bytes = new Uint8Array(24);
  crypto.getRandomValues(bytes);

  return Array.from(bytes)
    .map(b => b.toString(16).padStart(2, "0"))
    .join("");
}

/* =========================
   呼叫 Apps Script 後端
========================= */

function api(action, fields = {}) {
  return new Promise((resolve, reject) => {
    const ticket = newTicket();
    const callbackName = "staffCallback_" + ticket;
    const form = document.createElement("form");

    form.method = "POST";
    form.action = WEB_APP_URL;
    form.target = "postFrame";
    form.style.display = "none";

    const payload = { action, ticket, ...fields };

    for (const [name, value] of Object.entries(payload)) {
      const input = document.createElement("input");
      input.type = "hidden";
      input.name = name;
      input.value = String(value == null ? "" : value);
      form.appendChild(input);
    }

    let done = false;
    let attempts = 0;
    let pollTimer = null;
    let script = null;

    function cleanup() {
      if (pollTimer) clearTimeout(pollTimer);
      if (script) script.remove();

      try {
        delete window[callbackName];
      } catch (_) {}

      form.remove();
    }

    function finish(err, result) {
      if (done) return;

      done = true;
      cleanup();

      if (err) reject(err);
      else resolve(result);
    }

    function poll() {
      if (done) return;

      if (++attempts > 25) {
        finish(
          new Error("等待後端回覆逾時，請確認網路後重試。")
        );
        return;
      }

      script = document.createElement("script");
      const thisScript = script;

      window[callbackName] = data => {
        thisScript.remove();
        script = null;

        if (data && data.pending) {
          pollTimer = setTimeout(poll, 1000);
        } else if (data && typeof data === "object") {
          finish(null, data);
        } else {
          finish(new Error("後端回覆格式不正確。"));
        }
      };

      script.onerror = () => {
        thisScript.remove();
        script = null;
        pollTimer = setTimeout(poll, 1000);
      };

      script.src =
        WEB_APP_URL +
        "?callback=" + encodeURIComponent(callbackName) +
        "&ticket=" + encodeURIComponent(ticket) +
        "&_=" + Date.now();

      document.head.appendChild(script);
    }

    document.body.appendChild(form);

    try {
      form.submit();
      pollTimer = setTimeout(poll, 300);
    } catch (err) {
      finish(new Error("無法送出請求：" + err.message));
    }
  });
}

/* =========================
   相機功能
========================= */

async function stopCamera() {
  if (!scanner) return;

  try {
    if (cameraRunning) {
      await scanner.stop();
    }
  } catch (err) {
    console.warn("停止相機時發生問題：", err);
  }

  cameraRunning = false;
}

async function startScanner() {
  if (busy || cameraRunning) return;

  if (!session) {
    message("工作階段不存在，請重新登入。", "err");
    return;
  }

  if (!window.Html5Qrcode) {
    message(
      "掃描元件載入失敗，請確認網路後重新整理。",
      "err"
    );
    return;
  }

  try {
    if (!scanner) {
      scanner = new Html5Qrcode("reader");
    }

    message("正在啟動相機……");

    await scanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 250 } },
      decodedText => {
        if (!busy && !currentCode) {
          handleScan(decodedText);
        }
      },
      () => {}
    );

    cameraRunning = true;
    message("相機已啟動，請掃描參加者 QR Code。", "ok");

  } catch (err) {
    cameraRunning = false;

    message(
      "無法啟動相機。\n" +
      (err && err.message ? err.message : String(err)) +
      "\n\n請確認使用 HTTPS、瀏覽器相機權限已開啟，並允許此網站使用相機。",
      "err"
    );
  }
}

function extractCode(text) {
  const raw = String(text || "").trim();

  try {
    const url = new URL(raw);
    const code = url.searchParams.get("code");

    if (code) return code.trim();
  } catch (_) {}

  if (/^[A-Za-z0-9_-]{4,80}$/.test(raw)) {
    return raw;
  }

  throw new Error("無法從 QR Code 讀取有效的報到識別碼。");
}

/* =========================
   掃描及查詢參加者
========================= */

async function handleScan(decodedText) {
  if (busy || currentCode) return;

  busy = true;

  try {
    await stopCamera();

    const code = extractCode(decodedText);

    message("已讀取 QR Code，正在查詢參加者……");

    const result = await api("staffLookup", {
      code,
      session
    });

    if (!result.success) {
      if (/工作階段|重新驗證|逾期|無效/.test(result.message || "")) {
        await expireSession(result.message);
        return;
      }

      throw new Error(result.message || "查詢失敗。");
    }

    currentCode = code;
    currentParticipant = result.participant;

    renderParticipant(currentParticipant);

    show($("participantPanel"), true);

    message("查詢成功，請確認參加者資料。", "ok");

    $("participantPanel").scrollIntoView({
      behavior: "smooth",
      block: "start"
    });

  } catch (err) {
    message(err.message || String(err), "err");

    currentCode = "";
    currentParticipant = null;

  } finally {
    busy = false;
  }
}

/* =========================
   顯示參加者資料
   注意：此函式只負責更新畫面
========================= */

function renderParticipant(p) {
  const info = $("participantInfo");

  info.replaceChildren();

  const name = document.createElement("div");
  name.className = "participant-name";
  name.textContent = p.name || "未提供姓名";

  info.appendChild(name);

  const fields = [
    ["期別學號", p.studentId],
    ["參加人數", p.count],
    ["報到時間", p.checkInTime || "—"],
    ["報到設備", p.device || "—"]
  ];

  fields.forEach(([label, value]) => {
    const row = document.createElement("div");
    row.className = "field";

    const labelEl = document.createElement("div");
    labelEl.className = "label";
    labelEl.textContent = label;

    const valueEl = document.createElement("div");
    valueEl.className = "value";

    valueEl.textContent =
      value == null || value === "" ? "—" : value;

    row.append(labelEl, valueEl);
    info.appendChild(row);
  });

  const already = p.status === "已報到";

  const statusEl = $("participantStatus");

  statusEl.textContent = already
    ? "✓ 此參加者已經報到"
    : "尚未報到";

  statusEl.className =
    "status " + (already ? "warn" : "ok");

  statusEl.classList.toggle(
    "already-checked-in",
    already
  );

  const checkInButton = $("checkInButton");

  checkInButton.disabled = already;

  checkInButton.textContent = already
    ? "已報到，不可重複報到"
    : "確認報到";

  checkInButton.classList.toggle(
    "already-checked-in",
    already
  );
}

/* =========================
   確認報到按鈕
   事件只註冊一次
========================= */

$("checkInButton").addEventListener("click", () => {
  if (!currentParticipant || !currentCode || busy) return;

  if (currentParticipant.status === "已報到") {
    message(
      "此參加者已經報到，不會再次寫入。",
      "warn"
    );
    return;
  }

  $("confirmText").textContent =
    "確認為「" + currentParticipant.name +
    "」執行報到？\n期別學號：" +
    currentParticipant.studentId +
    "\n參加人數：" + currentParticipant.count;

  $("confirmDialog").showModal();
});

/* =========================
   取消確認
========================= */

$("confirmNo").addEventListener("click", () => {
  $("confirmDialog").close();
});

/* =========================
   執行報到
========================= */

$("confirmYes").addEventListener("click", async () => {
  $("confirmDialog").close();

  if (busy || !currentCode || !session) return;

  if (
    currentParticipant &&
    currentParticipant.status === "已報到"
  ) {
    message(
      "此參加者已經報到，不會再次寫入。",
      "warn"
    );
    renderParticipant(currentParticipant);
    return;
  }

  busy = true;
  $("checkInButton").disabled = true;

  message("正在寫入報到資料……");

  try {
    const result = await api("staffCheckIn", {
      code: currentCode,
      device: currentDeviceName,
      session
    });

    if (!result.success) {
      if (/工作階段|重新驗證|逾期|無效/.test(result.message || "")) {
        await expireSession(result.message);
        return;
      }

      throw new Error(result.message || "報到失敗。");
    }

    currentParticipant = result.participant;

    renderParticipant(currentParticipant);

    if (result.already) {
      message(
        "此參加者已經報到，系統未重複寫入。",
        "warn"
      );
    } else if (result.ok) {
      message("✓ 報到完成！", "ok");
    } else {
      message(
        "後端未確認報到完成，請核對試算表。",
        "err"
      );
    }

  } catch (err) {
    message(
      (err.message || String(err)) +
      "\n若不確定後端是否已寫入，請先重新查詢，不要連續重試。",
      "err"
    );

  } finally {
    busy = false;

    $("checkInButton").disabled =
      !currentParticipant ||
      currentParticipant.status === "已報到";
  }
});

/* =========================
   掃描下一位
========================= */

$("nextButton").addEventListener("click", async () => {
  if (busy) return;

  currentCode = "";
  currentParticipant = null;

  show($("participantPanel"), false);

  message("準備掃描下一位……");

  $("scannerPanel").scrollIntoView({
    behavior: "smooth",
    block: "start"
  });

  await startScanner();
});

/* =========================
   啟動／停止相機
========================= */

$("startButton").addEventListener("click", startScanner);

$("stopButton").addEventListener("click", async () => {
  await stopCamera();

  message("相機已停止。按「啟動相機」可繼續掃描。");
});

/* =========================
   工作階段失效
========================= */

async function expireSession(reason) {
  await stopCamera();

  session = "";
  currentDeviceName = "";
  localStorage.removeItem(SESSION_KEY);

  currentCode = "";
  currentParticipant = null;

  show($("loginPanel"), true);
  show($("scannerPanel"), false);
  show($("participantPanel"), false);

  message(
    (reason || "工作階段已失效。") +
    "\n請重新輸入工作人員 PIN。",
    "err"
  );

  $("loginPanel").scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}

/* =========================
   登出
========================= */

$("logoutButton").addEventListener("click", async () => {
  await stopCamera();

  session = "";
  currentDeviceName = "";
  currentCode = "";
  currentParticipant = null;

  localStorage.removeItem(SESSION_KEY);

  show($("loginPanel"), true);
  show($("scannerPanel"), false);
  show($("participantPanel"), false);

  message("已登出。");

  $("loginPanel").scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
});

/* =========================
   工作人員登入
========================= */

$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();

  if (busy) return;

  const pin = $("pin").value.trim();
  const deviceName = $("deviceName").value.trim();

  if (!deviceName) {
    message("請輸入登入者名稱。", "err");
    $("deviceName").focus();
    return;
  }

  if (deviceName.length > 10) {
    message("登入者名稱最多只能輸入 10 個字元。", "err");
    $("deviceName").focus();
    return;
  }

  if (!pin) {
    message("請輸入工作人員 PIN。", "err");
    return;
  }

  busy = true;
  $("loginButton").disabled = true;

  message("正在驗證工作人員……");

  try {
    const result = await api("staffLogin", { pin });

    if (!result.success || !result.session) {
      throw new Error(result.message || "登入失敗。");
    }

    session = result.session;
    currentDeviceName = deviceName;

    localStorage.setItem(SESSION_KEY, session);

    $("pin").value = "";

    show($("loginPanel"), false);
    show($("participantPanel"), false);
    show($("scannerPanel"), true);

    message("登入成功（登入者：" + currentDeviceName + "），請啟動相機。", "ok");
    $("loginStatus").innerHTML =
      '<span class="login-badge">✓ 已登入：' +
      currentDeviceName.replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;",
        '"': "&quot;", "'": "&#39;"
      })[char]) +
      '</span>';

    $("scannerPanel").scrollIntoView({
      behavior: "smooth",
      block: "start"
    });

  } catch (err) {
    message(err.message || String(err), "err");

  } finally {
    busy = false;
    $("loginButton").disabled = false;
  }
});

/* =========================
   頁面初始狀態
   每次開啟都要求重新登入
========================= */

show($("loginPanel"), true);
show($("scannerPanel"), false);
show($("participantPanel"), false);

message("請登入後開始測試。");
</script>

</body>
</html>
